# Copy to .github/workflows/ci.yml to enable (see ci/README.md).
name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-pptx
      - name: Derivation determinism + forge smoke + logic integrity
        run: python scripts/check_consistency.py
